# Netlify builds the static console with the repository's own Python -- no node step,
# no bundler, no lockfile. `tools/build_web.py` copies the package into a JSON bundle that
# the page's worker loads into Pyodide, so what runs in the browser is this package.
#
# Vendoring Pyodide (--vendor-pyodide) puts the ~16 MB runtime in the deploy rather than
# leaning on a CDN. It costs build time on the first deploy and buys a console that works
# on a plant network with no route to the internet. Drop the flag to use the CDN instead.

[build]
  command = "python3 tools/build_web.py --vendor-pyodide"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.11"

# The console keeps everything it makes in the browser. These are the headers that say so.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), interest-cohort=()"

[[headers]]
  for = "/pyodide/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/extrusion_twin_bundle.json"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/json"

[[headers]]
  for = "/twin-worker.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
